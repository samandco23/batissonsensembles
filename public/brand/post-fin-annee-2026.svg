 <text x="78" y="1058" font-family="Poppins,Arial,sans-serif" font-size="28" font-weight="700" fill="#1E1E1E">batissonsensembles-2bv4.vercel.app</text>
 <text x="78" y="1101" font-family="Poppins,Arial,sans-serif" font-size="20" font-weight="500" fill="#3C3C3C">Service client  +237 653 021 373</text>
 <rect x="72" y="1170" width="936" height="92" rx="12" fill="#F7EEE6"/>
 <text x="104" y="1227" font-family="Poppins,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E1E1E">Découvrez le projet et son règlement.</text>
 <text x="78" y="1301" font-family="Poppins,Arial,sans-serif" font-size="15" font-weight="500" fill="#6E6A66">Cliquez sur le lien ci-dessous pour découvrir le projet. Partagez cette affiche si le projet vous parle.</text>
