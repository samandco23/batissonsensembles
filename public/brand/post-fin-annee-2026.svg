 <text x="76" y="490" font-family="Poppins,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#fff">UNE ANNÉE S’ACHÈVE.</text>
 <text x="76" y="558" font-family="Poppins,Arial,sans-serif" font-size="50" font-weight="700" fill="#fff">Une idée continue de grandir.</text>
 <text x="78" y="670" font-family="Poppins,Arial,sans-serif" font-size="15" font-weight="500" fill="#fff">Image d’illustration</text>
 <text x="76" y="819" font-family="Poppins,Arial,sans-serif" font-size="25" font-weight="600" fill="#D65C17">Et si la suite, nous la bâtissions ensemble ?</text>
 <text x="78" y="880" font-family="Poppins,Arial,sans-serif" font-size="23" font-weight="400" fill="#3C3C3C">Un projet tech camerounais, un objectif partagé.</text>
 <text x="78" y="921" font-family="Poppins,Arial,sans-serif" font-size="23" font-weight="400" fill="#3C3C3C">Votre contribution commence à 100 FCFA.</text>
